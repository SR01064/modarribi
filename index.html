<style>

<script>

const VOICE_STYLE='Original anime-inspired mentor: mature masculine low register, deep and slightly raspy, energetic, varied, dramatic, confident and commanding. Speak English clearly. Do not imitate any existing character or actor.';

const opts=(a,s)=>a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('');

/* مشاهد SVG أصلية بطابع أنمي خيالي؛ تتبدل تلقائيًا وتلوّن الواجهة معها. */
const scenes=[
 {name:'وهج اللهب',c:'#ff7133',p:'#f1a34a',s2:'#ffc278',s3:'#c64835',s4:'#f1a34a',bg:'#11101b',energy:'#ff7133',svg:makeScene('#ff7133','#ffc278','#17101b')},

 {name:'العاصفة القرمزية',c:'#f04b63',p:'#ff9c7c',s2:'#ffad75',s3:'#bd3153',s4:'#f2a56c',bg:'#170c18',energy:'#f04b63',svg:makeScene('#e53651','#ffad75','#180b17')},

];let scenePick=-1,sceneTimer=0;
function makeScene(a,b,d){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${d}"/><stop offset=".52" stop-color="#10111d"/><stop offset="1" stop-color="#07090f"/></linearGradient><radialGradient id="a"><stop stop-color="${a}" stop-opacity=".8"/><stop offset=".38" stop-color="${a}" stop-opacity=".24"/><stop offset="1" stop-color="${a}" stop-opacity="0"/></radialGradient><linearGradient id="s" x2="0" y2="1"><stop stop-color="#171822"/><stop offset="1" stop-color="#05060b"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="22"/></filter></defs><path fill="url(#g)" d="M0 0h1600v1000H0z"/><ellipse cx="1120" cy="390" rx="520" ry="460" fill="url(#a)"/><path d="M0 760Q230 650 430 740t400-5 360 10 410-60v315H0z" fill="#080a12"/><g fill="none" stroke="${b}" opacity=".72"><path stroke-width="22" filter="url(#b)" d="M750 790Q1210 650 1320 300T1600 80M720 840Q1090 670 1190 420T1450 150"/><path stroke-width="4" d="M710 780Q1130 700 1270 340T1580 100M730 850Q1060 740 1160 460T1440 180"/></g><g fill="${b}" opacity=".65"><circle cx="1120" cy="248" r="3"/><circle cx="1370" cy="390" r="4"/><circle cx="1000" cy="490" r="3"/><circle cx="1510" cy="600" r="3"/><circle cx="900" cy="300" r="2"/><circle cx="1280" cy="150" r="3"/><circle cx="970" cy="670" r="2"/></g><g transform="translate(1170 520)" fill="url(#s)" stroke="${b}" stroke-opacity=".65" stroke-width="3"><path d="M-8-150Q-76-140-76-78q0 69 76 84 76-15 76-84 0-62-76-72l18 17-18 10-18-10z"/><path d="M-34-140Q-115-109-149-28l45 37 43-47-10 91q-54 45-107 116l61 28 92-81 92 81 61-28Q75 123 21 81L11-38l45 47 45-37Q67-109-14-140z"/><path d="M-16-110L-43 108l40 67 40-67L10-110z" opacity=".84"/><path d="M78-250l17 5-47 260-15-3z" fill="${b}" stroke="none" opacity=".75"/><path d="M-22-110q22 12 44 0" fill="none" stroke="${a}" stroke-width="7"/></g><path d="M0 912Q310 835 600 940t560-20 440 30" fill="none" stroke="${a}" stroke-opacity=".25" stroke-width="3"/></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function applyScene(){const candidates=scenes.map((_,i)=>i).filter(i=>i!==scenePick),next=candidates[Math.floor(Math.random()*candidates.length)];scenePick=next;const s=scenes[next],root=document.documentElement;root.style.setProperty('--scene',`url("${s.svg}")`);root.style.setProperty('--energy',s.energy);root.style.setProperty('--energy2',s.s2);root.style.setProperty('--energy3',s.s3);root.style.setProperty('--energy4',s.s4);root.style.setProperty('--a',s.energy);root.style.setProperty('--p',s.p);root.style.setProperty('--bg',s.bg);root.style.setProperty('--g',`linear-gradient(132deg,${s.bg} 0%,#17131a 48%,${s.energy} 145%)`)}
function startSceneRotation(){applyScene();clearInterval(sceneTimer);sceneTimer=setInterval(()=>{if(!document.hidden)applyScene()},70000)}

/* ===== قاعدة البيانات المحلية (IndexedDB) مع بديل في الذاكرة ===== */
const mem={};let idb=null;
const dbOpen=()=>new Promise(r=>{try{const q=indexedDB.open('modarrebi',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{idb=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const dbGet=k=>new Promise(r=>{try{if(!idb)return r(mem[k]);const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(mem[k])}catch(e){r(mem[k])}});
const save=()=>{mem.S=S;return new Promise(r=>{try{if(!idb)return r();const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(S,'S');t.oncomplete=r;t.onerror=r}catch(e){r()}})};

/* ===== مساعد محلي: لا يحتاج مفتاح Claude API ===== */
function offlineAI(user,msgs,json=true,system=''){
 const last=String(msgs?.[msgs.length-1]?.content??user??''),p=String(user??'')+'\n'+String(system??'')+'\n'+last,low=p.toLowerCase();
 if(!json)return 'You showed up and gave it a real try. Pick one thing you did well, then choose one small step to improve next time.';
 if(p.includes('مفاتيح الصلوات')&&p.includes('مهامه:')){
  const complete=/(خلصت|أنجزت|عملت|ذاكرت|تمرنت|صليت|قرأت|قريت|انتهيت|تم)/.test(p);
  const tasks=complete?day().tasks.filter(t=>p.includes(t.t)).map(t=>t.id):[];
  const prayers=Object.keys(PN).filter(k=>p.includes(PN[k]));

 }
 if(p.includes('المهمة دي مش مناسبة')){
  const original=p.match(/المهمة دي مش مناسبة: (.+?)\. اقترح/)?.[1]||'';
  const alt=FB.find(x=>x[0]!==original)||FB[0];
  return {t:alt[0],cat:alt[1],time:alt[2],d:'بديل بسيط تقدر تعدّله وقت ما تحب'};
 }
 if(p.includes('"sum"')&&p.includes('"best"')){
  const done=[...Array(7)].flatMap((_,i)=>S.days[ds(-i)]?.tasks||[]).filter(t=>t.done).length;
  return {sum:`أنجزت ${done} مهمة خلال آخر أسبوع. خليك مركز على الاستمرار، حتى لو بخطوات صغيرة.`,best:'الاستمرار في تسجيل يومك',weak:'المهام التي تأجلت',next:'اختار ٣ أولويات واقعية كل يوم'};
 }
 if(p.includes('"ex"')&&p.includes('"sets"'))return {type:'تمرين جسم كامل خفيف',why:'خطة عامة بأربع حركات أساسية، خففها أو أوقفها لو شعرت بألم.',ex:[{n:'قرفصاء بوزن الجسم',sets:3,reps:'8–12',how:'انزل ببطء مع ثبات الظهر والركبتين باتجاه أصابع القدم.',err:'لا تحبس النفس ولا تكمل مع ألم حاد.',q:'قرفصاء وزن الجسم شرح صحيح',w:0},{n:'ضغط على الحائط أو سطح مرتفع',sets:3,reps:'6–10',how:'حافظ على الجسم مستقيمًا وانزل بتحكم.',err:'لا تهبط بسرعة أو تقفل المرفقين بعنف.',q:'تمرين ضغط مبتدئين على الحائط',w:0},{n:'جسر الحوض',sets:3,reps:'10–12',how:'ارفع الحوض مع شد بسيط للبطن ثم انزل ببطء.',err:'لا تبالغ في تقويس أسفل الظهر.',q:'تمرين جسر الحوض للمبتدئين',w:0},{n:'سحب حقيبة خفيفة',sets:3,reps:'8–12',how:'اسحب الحقيبة باتجاه الجذع مع ظهر ثابت.',err:'ابدأ بحمل خفيف وتوقف لو ظهر ألم.',q:'تمرين سحب حقيبة في البيت',w:0}]};
 if(p.includes('"topic"'))return {topic:['احكي عن عادة صغيرة عايز تثبتها','موقف اتعلمت منه حاجة جديدة','إيه الحاجة اللي بتخليك تكمل يوم صعب؟','اشرح هدفك كأنك بتشرحه لصاحبك'][Math.floor(Math.random()*4)]};
 if(p.includes('"title"')&&p.includes('"detail"')){
  if(p.includes('A2')||p.includes('إنجليزي'))return {title:'تدريب إنجليزي: يومك في ٥ جمل',detail:'اكتب خمس جمل قصيرة بالإنجليزية عن يومك. استخدم: I woke up, I studied, I worked, I felt, I learned. اقرأها بصوت عالٍ.',q:'English A2 talk about your daily routine'};
  if(p.includes('حاسبات ومعلومات'))return {title:'أساسيات البرمجة: المتغيرات',detail:'تعلّم معنى المتغير، ثم اكتب مثالًا يخزن اسمًا ورقمًا. جرّب تغيير القيمة ولاحظ النتيجة.',q:'شرح المتغيرات في البرمجة للمبتدئين بالعربي'};
  if(p.includes('القرآن'))return {title:'ورد قصير بتدبر',detail:'اقرأ صفحتين أو مقدارًا يناسب وقتك، واختر آية واحدة لتتدبر معناها من تفسير موثوق.',q:''};
  if(p.includes('الكتاب'))return {title:'قراءة مركزة لمدة ١٠ دقائق',detail:'اقرأ من الكتاب الحالي عشر دقائق، واكتب فكرة واحدة تريد تذكرها.',q:''};
  if(p.includes('فيديو مفيد'))return {title:'تواصل بثقة: الاستماع قبل الرد',detail:'شاهد شرحًا قصيرًا عن الاستماع الفعال، ثم لخّص فكرته في سطرين.',q:'مهارة الاستماع الفعال شرح عربي'};
  return {title:'خطوة تعلم صغيرة',detail:'اقرأ أو شاهد شرحًا قصيرًا في هدفك الحالي، ثم دوّن أهم فكرة وتطبيقًا واحدًا.',q:''};

 const asrA=Math.atan(1/(1+Math.tan(Math.abs(lat*R-dec))))/R;
 const h={fajr:noon-T(-m[1]),dhuhr:noon+.035,asr:noon+T(asrA),maghrib:noon+T(-.833),isha:noon+T(-m[2])};
 const b=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()).getTime(),o={};

function quranRange(p){let i=Math.max(0,Math.min(113,(+p.surah||1)-1)),v=Math.max(1,+p.verse||1),left=Math.max(1,+p.perDay||5),ranges=[];while(left>0&&i<114){const max=QURAN_CHAPTERS[i].count;if(v>max){i++;v=1;continue}const end=Math.min(max,v+left-1);ranges.push({i,from:v,to:end});left-=end-v+1;if(end<max){v=end+1;break}i++;v=1}return {ranges,nextSurah:Math.min(i+1,114),nextVerse:i>=114?QURAN_CHAPTERS[113].count+1:v,complete:i>=114}}

function unlockVoiceAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}catch(_){}}
async function fishTts(text,automatic=false){
 const status=$('#fishStatus'),player=$('#fishPlayer');
 if(!S.p.fishProxy||!S.p.fishVoice){tm('أدخل عنوان الخادم الوسيط ومعرّف الصوت في الإعدادات');return}
 if(status)status.textContent='جاري إنشاء الصوت…';
 try{
  const endpoint=new URL(S.p.fishProxy,location.href);
  if(endpoint.protocol!=='https:'&&endpoint.hostname!=='localhost'&&endpoint.hostname!=='127.0.0.1')throw new Error('استخدم عنوان HTTPS لخادم الوسيط.');
  const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,reference_id:S.p.fishVoice,model:'s2.1-pro-free',format:'mp3',direction:VOICE_STYLE})});
  if(!response.ok){let detail='';try{const j=await response.json();detail=j.message||j.error||j.detail||''}catch(_){try{detail=await response.text()}catch(__){}}throw new Error(detail||`الخادم رفض الطلب (${response.status}).`)}
  const type=(response.headers.get('content-type')||'').toLowerCase();if(!type.includes('audio')&&!type.includes('octet-stream'))throw new Error('استجابة الخادم ليست ملفًا صوتيًا. تحقق من إعداد الوسيط.');
  const blob=await response.blob();if(fishAudio)URL.revokeObjectURL(fishAudio);fishAudio=URL.createObjectURL(blob);const out=player||(fishPlayback||(fishPlayback=new Audio()));out.src=fishAudio;if(player)player.style.display='block';if(automatic&&audioCtx&&audioCtx.state==='running'){const decoded=await audioCtx.decodeAudioData(await blob.arrayBuffer()),source=audioCtx.createBufferSource();source.buffer=decoded;source.connect(audioCtx.destination);await new Promise((resolve,reject)=>{source.onended=resolve;try{source.start()}catch(e){reject(e)}})}else await out.play();if(status)status.textContent='تم إنشاء الصوت. لو لم يبدأ، اضغط تشغيل في مشغل الصوت.';
 }catch(e){const msg=e instanceof TypeError?'تعذر الوصول إلى الخادم. تحقق من عنوانه وCORS والاتصال.':e.message;if(status)status.textContent='خطأ: '+msg;tm(msg)}
}
function reserveTaskLine(){
 let used=Array.isArray(S.voiceUsed)?S.voiceUsed:[];
 if(used.length>=AUTO_VOICE_LINES.length){const last=used[used.length-1];used=[];let choices=AUTO_VOICE_LINES.map((_,i)=>i).filter(i=>i!==last);const pick=choices[Math.floor(Math.random()*choices.length)];used.push(pick);S.voiceUsed=used;save();return AUTO_VOICE_LINES[pick]}
 const choices=AUTO_VOICE_LINES.map((_,i)=>i).filter(i=>!used.includes(i));
 const pick=choices[Math.floor(Math.random()*choices.length)];
 S.voiceUsed=[...used,pick];save();return AUTO_VOICE_LINES[pick];
}
function taskDoneVoice(){
 if(!S.p.fishProxy||!S.p.fishVoice)return;
 voiceQueue.push(reserveTaskLine());
 if(!voiceRunning)playTaskVoiceQueue();
}
async function playTaskVoiceQueue(){
 voiceRunning=true;
 while(voiceQueue.length){const line=voiceQueue.shift();await fishTts(line,true)}
 voiceRunning=false;
}
